name: Busca Automática de Vagas

on:
  schedule:
    - cron: '0 11,13,15,17,19,21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  atualizar-painel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Buscar e pontuar vagas
        run: python atualizar_vagas.py
      - name: Salvar atualizações no site
        run: |
          git config user.name "Agente de Vagas"
          git config user.email "agente@github-actions.local"
          git add vagas.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Atualização automática de vagas" && git push)
